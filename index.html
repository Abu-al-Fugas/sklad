<div class="container" id="app">
  
  <!-- ЭКРАН СТАРТА -->

    <div class="card">

  <footer>PWA | ТО ПУРГ | v8.1</footer>
</div>

<!-- МОДАЛКА ПРОСМОТРА МЕДИА -->
<div id="photoModal" class="modal">

<script>

    navigator.serviceWorker.register('sw.js').then(() => console.log('PWA Offline Ready'));
  }

  // ---- Конфигурация Firebase ----
  const firebaseConfig = {
    apiKey: "AIzaSyBvo10dq0VkZeBaP-Cv3GVIJfEW23QzKIk",
    authDomain: "smt-sklad-8f993.firebaseapp.com",
    databaseURL: "https://smt-sklad-8f993-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "smt-sklad-8f993",
    storageBucket: "smt-sklad-8f993.firebasestorage.app",
    messagingSenderId: "541634074689",
    appId: "1:541634074689:web:625e141e5548e7fbcc4ec0"
  };

  let fbDb = null;
  function initFirebase() {
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      fbDb = firebase.database();
      fbDb.ref('.info/connected').on('value', snap => {
        if (snap.val() === true) syncPendingRecords();
      });
      syncPendingRecords();
    }
  }

  function uint8ToBase64(u8Arr) {
    let CHUNK_SIZE = 8192; 
    let index = 0; let length = u8Arr.length; let result = ''; let slice;
    while (index < length) {
      slice = u8Arr.subarray(index, Math.min(index + CHUNK_SIZE, length));
      result += String.fromCharCode.apply(null, slice);
      index += CHUNK_SIZE;
    }
    return btoa(result);
  }

  function base64ToUint8(base64) {
    let binary_string = window.atob(base64);
    let len = binary_string.length;
    let bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) { bytes[i] = binary_string.charCodeAt(i); }
    return bytes;
  }

  // ---- IndexedDB База Данных ----
  let db;
  const dbRequest = indexedDB.open("PurgPWA_DB", 8);
  dbRequest.onupgradeneeded = (e) => {
    const database = e.target.result;
    if (!database.objectStoreNames.contains("archives")) { database.createObjectStore("archives", { keyPath: "name" }); }
    if (!database.objectStoreNames.contains("drafts")) { database.createObjectStore("drafts", { keyPath: "id" }); }
    if (!database.objectStoreNames.contains("pending_sync")) { database.createObjectStore("pending_sync", { keyPath: "id", autoIncrement: true }); }
  };
  dbRequest.onsuccess = (e) => { db = e.target.result; checkDraft(); };
  dbRequest.onerror = (e) => console.error("IndexedDB error", e);

  // ---- АЛГОРИТМ ТЗ: Нумерация от 1 до 17 и русские названия файлов ----
  const mandatoryConfig = [
    // СТРАНИЦА 1
    { title: "1. Фото ключа ПУРГ", prefix: "01_key", filePrefix: "01_Ключ", needsPhoto: true, page: 1 },
    { title: "2. Общее фото ПУРГ до всех работ (вместе с травой и т.д.)", prefix: "02_before", filePrefix: "02_Общее_фото_до", needsPhoto: true, page: 1 },
    { title: "3. Проверка замков на дверях", prefix: "03_locks", filePrefix: "03_Замки", needsComment: true, page: 1 },
    { title: "4. Покос травы на территории ПУРГ. Общее фото после покоса.", prefix: "04_grass", filePrefix: "04_Покос", needsPhoto: true, isCheckbox: true, checkboxLabel: "Покос выполнен", page: 1 },

    // СТРАНИЦА 2
    { title: "5. Замер газоанализатором внутри ПУРГ и поиск утечек (до начала работ).", prefix: "06_gas_1", filePrefix: "05_Утечки_до", options: ["Утечек нет", "Обнаружена утечка"], condCommentFor: ["Обнаружена утечка"], condPhotoFor: ["Обнаружена утечка"], customAddBtns: [{ icon: "📸", text: "Фото утечки" }], page: 2 },
    { title: "6. Проверка работоспособности освещения в ПУРГ.", prefix: "07_light", filePrefix: "06_Освещение", needsComment: true, page: 2 },
    { title: "7. Общее фото ПУРГ изнутри (ветки, байпас, мусор).", prefix: "08_inside_before", filePrefix: "07_Внутри_до", needsPhoto: true, page: 2 },
    { title: "8. Уборка мусора внутри ПУРГ. Фото после уборки.", prefix: "09_cleanup", filePrefix: "08_Уборка", needsPhoto: true, options: ["Уборка выполнена", "Уборка не требуется"], page: 2 },
    { title: "9. Проверка работоспособности кранов внутри и снаружи.", prefix: "11_valves", filePrefix: "09_Краны", needsComment: true, page: 2 },

    // СТРАНИЦА 3
    { title: "10. Замер давления. Проверка манометров (с фото).", prefix: "12_pressure", filePrefix: "10_Давление", needsPhoto: true, customAddBtns: [{ icon: "📸", text: "Эталон" }, { icon: "📸", text: "Приборы" }], options: ["Все исправно", "Неисправно"], condCommentFor: ["Неисправно"], page: 3 },
    { title: "11. Проверка состояния газового фильтра и перепада (с фото).", prefix: "14_filter", filePrefix: "11_Фильтр", needsPhoto: true, options: ["Фильтр чист", "Загрязнен", "Неисправен"], condCommentFor: ["Загрязнен", "Неисправен"], page: 3 },
    { title: "12. Проверка переключения на нужную ветку (лето/зима).", prefix: "15_branches", filePrefix: "12_Ветки", options: ["Ветка зима", "Ветка лето", "Только одна ветка"], page: 3 },
    { title: "13. Проверка работоспособности счетчиков и корректоров.", hint: "Счетчики: вращение, пломбы, масло. Корректоры: батарея, пломбы, датчики, показания.", prefix: "16_meters", filePrefix: "13_Счетчики_Корректоры", needsPhoto: true, customAddBtns: [{ icon: "📸", text: "Общий вид" }, { icon: "🎥", text: "Видео", isVideo: true }, { icon: "📸", text: "Пломбы" }, { icon: "📸", text: "Масло" }, { icon: "📸", text: "Экраны" }], options: ["Все работает", "Неисправность"], condCommentFor: ["Неисправность"], page: 3 },
    { title: "14. Скачивание архивов с корректоров.", prefix: "17_archives", filePrefix: "14_Архивы", options: ["Архивы скачаны", "Архив не скачан"], condCommentFor: ["Архив не скачан"], page: 3 },
    { title: "15. Проверка наличия заземлений и их подключения (с фото).", prefix: "18_grounding", filePrefix: "15_Заземление", needsPhoto: true, options: ["Есть заземление", "Нет заземления"], condCommentFor: ["Нет заземления"], page: 3 },
    { title: "16. Повторный замер газоанализатором внутри ПУРГ.", prefix: "19_gas_2", filePrefix: "16_Утечки_после", options: ["Утечка отсутствует", "Утечка устранена", "Утечка есть"], condCommentFor: ["Утечка есть"], page: 3 },
    { title: "17. Дополнительные примечания.", prefix: "21_notes", filePrefix: "17_Примечания", needsComment: true, isOptional: true, page: 3 }
  ];

  // ---- СТЕЙТ ПРИЛОЖЕНИЯ ----
  let state = { 
    purgName: '', address: '', installerName: '', 
    coordinates: null, creationDate: null, gpsLocked: false,
    media: Array.from({ length: mandatoryConfig.length }, () => []), 
    comments: {}, selections: {}, checkboxes: {},
    currentPage: 1, currentActiveIndex: null, currentActiveSubIndex: null, isReportGenerated: false
  };
  let currentZipName = "";
  let watchId = null; let gpsTimeoutId = null;

  // DOM Элементы
  const formScreen = document.getElementById('formScreen');
  const checklistScreen = document.getElementById('checklistScreen');
  const archiveScreen = document.getElementById('archiveScreen');
  const mandatoryListDiv = document.getElementById('mandatoryList');
  
  const globalFileInput = document.getElementById('globalFileInput');
  const globalVideoInput = document.getElementById('globalVideoInput');
  
  const generateBtn = document.getElementById('generateReportBtn');
  const shareTextBtn = document.getElementById('shareTextBtn');
  const displayCoords = document.getElementById('displayCoords');
  
  const navNextBtn = document.getElementById('navNextBtn');
  const navPrevBtn = document.getElementById('navPrevBtn');
  const resetAllBtn = document.getElementById('resetAllBtn');
  const startReportBtn = document.getElementById('startReportBtn');
  
  const manualSendInstructions = document.getElementById('manualSendInstructions');
  const savedFileNameSpan = document.getElementById('savedFileNameSpan');
  const archiveListContainer = document.getElementById('archiveListContainer');
  const multiActionBar = document.getElementById('multiActionBar');
  const syncStatus = document.getElementById('syncStatus');
  const pageTitleIndicator = document.getElementById('pageTitleIndicator');

  // Установка отметки об изменениях (сброс флага генерации)
  function markAsEdited() {
      state.isReportGenerated = false;
      resetGenBtn();
      saveDraft();
      updatePaginationButtons();
  }

  function resetGenBtn() { 
      generateBtn.innerText = "Сформировать архив"; 
      generateBtn.disabled = false; 
  }

  // Валидация главных полей первой страницы
  function updateMainValidation() {
    let allValid = true;
    ['purgName', 'address', 'installerName'].forEach(id => {
      const el = document.getElementById(id);
      if(el) {
          const isValid = state[id] && state[id].trim() !== '';
          el.classList.toggle('valid', isValid);
          if (!isValid) allValid = false;
      }
    });
    startReportBtn.disabled = !allValid;
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedName = localStorage.getItem('installerName'); 
    if (savedName) {
        document.getElementById('installerName').value = savedName;
        state.installerName = savedName;
    }
    updateMainValidation();
  });

  function formatDateTime(isoString) { 
    if (!isoString) return '—'; 
    const d = new Date(isoString); 
    return d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}); 
  }

  function saveDraft() {
    if (!db) return;
    const draftState = {
      purgName: state.purgName, address: state.address, installerName: state.installerName,
      coordinates: state.coordinates, creationDate: state.creationDate, gpsLocked: state.gpsLocked, 
      media: state.media, comments: state.comments, selections: state.selections, checkboxes: state.checkboxes,
      currentPage: state.currentPage, isReportGenerated: state.isReportGenerated
    };
    db.transaction("drafts", "readwrite").objectStore("drafts").put({ id: "current", data: draftState });
  }

  function clearDraft() { 
    if (db) db.transaction("drafts", "readwrite").objectStore("drafts").delete("current"); 
  }

  function checkDraft() {
    if (!db) return;
    const req = db.transaction("drafts", "readonly").objectStore("drafts").get("current");
    req.onsuccess = (e) => {
      const result = e.target.result;
      if (result && result.data) {
        const d = result.data;
        state.purgName = d.purgName || ''; state.address = d.address || ''; state.installerName = d.installerName || ''; 
        state.coordinates = d.coordinates || null; state.creationDate = d.creationDate || null; state.gpsLocked = d.gpsLocked || false;
        state.comments = d.comments || {}; state.selections = d.selections || {}; state.checkboxes = d.checkboxes || {};
        state.currentPage = d.currentPage || 1;
        state.isReportGenerated = d.isReportGenerated || false;
        
        if (d.media) { 
            state.media = d.media; 
            state.media.forEach(arr => {
                arr.forEach(m => {
                    if (m.type === 'video' && m.fileObj && !m.dataUrl) {
                        m.dataUrl = URL.createObjectURL(m.fileObj);
                    }
                });
            });
            while (state.media.length < mandatoryConfig.length) state.media.push([]); 
        }

        document.getElementById('purgName').value = state.purgName; 
        document.getElementById('address').value = state.address; 
        document.getElementById('installerName').value = state.installerName; 
        
        updateMainValidation();
        if (state.creationDate) {
          formScreen.classList.add('hidden'); checklistScreen.classList.remove('hidden');
          
          renderChecklist();
          
          if (!state.gpsLocked) { startActiveGeoSearch(); } 
          else if (state.coordinates && !state.coordinates.error) { 
            displayCoords.className = "geo-status-badge geo-success"; 
            displayCoords.innerText = `${state.coordinates.lat.toFixed(6)}, ${state.coordinates.lng.toFixed(6)}`; 
          } else { 
            displayCoords.className = "geo-status-badge geo-error"; 
            displayCoords.innerText = "GPS не найден"; 
          }
        }
      }
    };
  }

  function startActiveGeoSearch() {
    if (state.gpsLocked) return;
    if (!navigator.geolocation) { state.coordinates = { error: "GPS недоступен" }; displayCoords.className = "geo-status-badge geo-error"; displayCoords.innerText = "GPS недоступен"; saveDraft(); return; }
    displayCoords.className = "geo-status-badge geo-searching"; displayCoords.innerText = "Ожидание...";
    if (watchId !== null) navigator.geolocation.clearWatch(watchId); if (gpsTimeoutId !== null) clearTimeout(gpsTimeoutId);
    
    watchId = navigator.geolocation.watchPosition(
      (pos) => { state.coordinates = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }; displayCoords.className = "geo-status-badge geo-searching"; displayCoords.innerText = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`; saveDraft(); },
      (err) => { if (!state.coordinates || state.coordinates.error) { state.coordinates = { error: "Ошибка" }; displayCoords.className = "geo-status-badge geo-error"; displayCoords.innerText = "Слабый сигнал..."; saveDraft(); } },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
    gpsTimeoutId = setTimeout(() => {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      state.gpsLocked = true; saveDraft();
      if (state.coordinates && !state.coordinates.error) { displayCoords.className = "geo-status-badge geo-success"; displayCoords.innerText = `${state.coordinates.lat.toFixed(6)}, ${state.coordinates.lng.toFixed(6)}`; } else { displayCoords.className = "geo-status-badge geo-error"; displayCoords.innerText = "Спутники не найдены"; }
    }, 20000);
  }

  function syncPendingRecords() {
    if (!navigator.onLine || !db || !fbDb) return;
    db.transaction("pending_sync", "readonly").objectStore("pending_sync").getAll().onsuccess = (e) => {
      e.target.result.forEach(record => {
        fbDb.ref('purg_reports').push(record.data).then(() => { 
            db.transaction("pending_sync", "readwrite").objectStore("pending_sync").delete(record.id); 
        }).catch(err => console.log("Firebase sync err", err));
      });
    };
  }

  window.addEventListener('online', () => { syncStatus.classList.add('hidden'); syncPendingRecords(); });
  window.addEventListener('offline', () => { syncStatus.classList.remove('hidden'); });

  ['purgName', 'address', 'installerName'].forEach(id => { 
    document.getElementById(id).addEventListener('input', (e) => { 
        state[id] = e.target.value.trim(); markAsEdited(); updateMainValidation(); 
    }); 
  });

  // Рендер динамического чек-листа
  function renderChecklist() {
    pageTitleIndicator.innerText = `Страница ${state.currentPage} из 3`;
    mandatoryListDiv.innerHTML = '';
    
    mandatoryConfig.forEach((cfg, idx) => {
      if (cfg.page !== state.currentPage) return;

      const mediaArray = state.media[idx];
      const hasMedia = mediaArray && mediaArray.length > 0;
      const item = document.createElement('div'); 
      item.className = 'photo-item';
      
      const headerDiv = document.createElement('div'); 
      headerDiv.className = 'photo-header';
      
      let metaHtml = '';
      if (cfg.needsPhoto || cfg.condPhotoFor) {
          let errText = "Фото не загружены *";
          if (cfg.customAddBtns && cfg.customAddBtns.some(b => b.isVideo)) errText = "Файлы не загружены *";
          
          if (cfg.condPhotoFor) {
               const isConditionMet = cfg.condPhotoFor.includes(state.selections[cfg.prefix]);
               if (isConditionMet) {
                   metaHtml = hasMedia ? `<div class="photo-meta">Загружено файлов: ${mediaArray.length}</div>` : `<div class="photo-meta" style="color:#ef4444;">${errText}</div>`;
               }
          } else {
               metaHtml = hasMedia ? `<div class="photo-meta">Загружено файлов: ${mediaArray.length}</div>` : `<div class="photo-meta" style="color:#ef4444;">${errText}</div>`;
          }
      }
      
      headerDiv.innerHTML = `<div><div class="photo-title">${cfg.title}</div>
                             ${cfg.hint ? `<div style="font-size: 0.75rem; color:#64748b; margin-top:4px;">${cfg.hint}</div>` : ''}
                             ${metaHtml}</div>`;
      item.appendChild(headerDiv);

      // Чекбокс
      if (cfg.isCheckbox) {
          const lbl = document.createElement('label');
          lbl.className = `task-checkbox-label ${state.checkboxes[cfg.prefix] ? 'checked' : ''}`;
          lbl.style.marginBottom = '8px';
          
          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.className = 'task-checkbox-input';
          chk.checked = !!state.checkboxes[cfg.prefix];
          
          chk.addEventListener('change', (e) => {
              state.checkboxes[cfg.prefix] = e.target.checked;
              lbl.className = `task-checkbox-label ${e.target.checked ? 'checked' : ''}`;
              markAsEdited();
          });
          
          lbl.appendChild(chk);
          lbl.appendChild(document.createTextNode(cfg.checkboxLabel));
          item.appendChild(lbl);
      }

      // Радиокнопки
      if (cfg.options) {
          const optionsDiv = document.createElement('div');
          optionsDiv.className = 'radio-wrapper';
          optionsDiv.style.marginBottom = '8px';
          
          let isValidChoice = state.selections[cfg.prefix] !== undefined;
          if (isValidChoice) optionsDiv.classList.add('valid');
          else optionsDiv.classList.add('error-state');
          
          let html = '<div class="radio-grid">';
          cfg.options.forEach(opt => {
             const isChecked = state.selections[cfg.prefix] === opt ? 'checked' : '';
             html += `<label class="radio-card"><input type="radio" name="${cfg.prefix}" value="${opt}" ${isChecked}> ${opt}</label>`;
          });
          html += '</div>';
          optionsDiv.innerHTML = html;
          
          // Контейнер условного комментария
          const condCommentWrap = document.createElement('div');
          condCommentWrap.style.marginTop = '8px';
          
          const condTxt = document.createElement('textarea');
          condTxt.className = 'mandatory-field';
          condTxt.placeholder = "Укажите детали (Обязательно)...";
          condTxt.value = state.comments[cfg.prefix] || '';
          if(state.comments[cfg.prefix] && state.comments[cfg.prefix].trim() !== '') {
              condTxt.classList.add('valid');
          }
          condCommentWrap.appendChild(condTxt);

          // Контейнер условного фото (например пункт 5)
          let condPhotoWrap = null;
          if (cfg.condPhotoFor) {
              condPhotoWrap = document.createElement('div');
              condPhotoWrap.style.display = 'flex';
              condPhotoWrap.style.flexDirection = 'column';
              condPhotoWrap.style.gap = '8px';
              condPhotoWrap.style.marginTop = '4px';
              
              const btnsToRender = cfg.customAddBtns || [{ icon: "➕", text: "Добавить" }];
              
              btnsToRender.forEach((btn, subIdx) => {
                  const rowWrapper = document.createElement('div');
                  rowWrapper.className = 'media-section';
                  
                  const relevantMedia = mediaArray ? mediaArray.map((m, originalIndex) => ({...m, originalIndex})).filter(m => (m.subIdx === subIdx) || (m.subIdx === undefined && subIdx === 0)) : [];
                  const hasSubMedia = relevantMedia.length > 0;

                  const placeholder = document.createElement('div');
                  placeholder.className = 'add-photo-placeholder';
                  if (hasSubMedia) placeholder.classList.add('valid');
                  placeholder.innerHTML = `<span>${btn.icon}</span>${btn.text}`;
                  
                  placeholder.onclick = () => { 
                      state.currentActiveIndex = idx; 
                      state.currentActiveSubIndex = subIdx; 
                      if (btn.isVideo) globalVideoInput.click();
                      else globalFileInput.click(); 
                  };
                  rowWrapper.appendChild(placeholder);

                  const photosRow = document.createElement('div');
                  photosRow.className = 'media-photos-row';
                  
                  if (hasSubMedia) {
                      relevantMedia.forEach(mData => {
                          const pContainer = document.createElement('div'); 
                          pContainer.className = 'photo-container';
                          
                          let previewSrc = mData.dataUrl;
                          if (mData.type === 'video' && mData.fileObj) previewSrc = URL.createObjectURL(mData.fileObj);
                          
                          let mediaEl;
                          if (mData.type === 'video') {
                              mediaEl = document.createElement('video');
                              mediaEl.src = previewSrc;
                              mediaEl.className = 'thumbnail';
                              mediaEl.muted = true;
                              mediaEl.onclick = (e) => { e.stopPropagation(); openLightbox(previewSrc, 'video'); };
                          } else {
                              mediaEl = document.createElement('img');
                              mediaEl.src = previewSrc;
                              mediaEl.className = 'thumbnail';
                              mediaEl.onclick = (e) => { e.stopPropagation(); openLightbox(previewSrc, 'image'); };
                          }
                          
                          const delBtn = document.createElement('button'); 
                          delBtn.className = 'delete-btn'; 
                          delBtn.innerHTML = '&times;'; 
                          delBtn.onclick = (e) => { e.stopPropagation(); removeMedia(idx, mData.originalIndex); };
                          
                          pContainer.appendChild(mediaEl); 
                          pContainer.appendChild(delBtn); 
                          photosRow.appendChild(pContainer);
                      });
                  } else {
                      photosRow.innerHTML = `<div style="width:100%; color:#94a3b8; font-size:0.8rem; margin-left: 8px;">Ожидание файлов...</div>`;
                  }
                  
                  rowWrapper.appendChild(photosRow);
                  condPhotoWrap.appendChild(rowWrapper);
              });
          }

          const checkCondition = () => {
              const selected = state.selections[cfg.prefix];
              const showComment = cfg.condCommentFor && cfg.condCommentFor.includes(selected);
              condCommentWrap.style.display = showComment ? 'block' : 'none';
              
              if (condPhotoWrap) {
                  const showPhoto = cfg.condPhotoFor && cfg.condPhotoFor.includes(selected);
                  condPhotoWrap.style.display = showPhoto ? 'flex' : 'none';
              }
          };
          checkCondition();
          
          optionsDiv.querySelectorAll('input[type="radio"]').forEach(radio => {
              radio.addEventListener('change', (e) => {
                  state.selections[cfg.prefix] = e.target.value;
                  optionsDiv.classList.remove('error-state');
                  optionsDiv.classList.add('valid');
                  checkCondition();
                  markAsEdited();
              });
          });
          
          condTxt.addEventListener('input', (e) => {
              state.comments[cfg.prefix] = e.target.value;
              condTxt.classList.toggle('valid', state.comments[cfg.prefix].trim() !== '');
              markAsEdited();
          });

          item.appendChild(optionsDiv);
          item.appendChild(condCommentWrap);
          if(condPhotoWrap) item.appendChild(condPhotoWrap);
      } 
      // Безусловное поле для комментария
      else if (cfg.needsComment) {
          const txt = document.createElement('textarea');

          } else {
              txt.className = 'mandatory-field';
              txt.placeholder = "Введите комментарий (Обязательно)...";
          }
          
          txt.value = state.comments[cfg.prefix] || '';
          if(!cfg.isOptional && state.comments[cfg.prefix] && state.comments[cfg.prefix].trim() !== '') {
              txt.classList.add('valid');
          }
          
          txt.addEventListener('input', (e) => {
              state.comments[cfg.prefix] = e.target.value;
              if(!cfg.isOptional) {
                  txt.classList.toggle('valid', state.comments[cfg.prefix].trim() !== '');
              } else {
                  txt.style.borderColor = state.comments[cfg.prefix].trim() !== '' ? '#22c55e' : '#cbd5e1';
              }
              markAsEdited();
          });
          item.appendChild(txt);
      }

      // Блок безусловного прикрепления медиа
      if (cfg.needsPhoto && !cfg.condPhotoFor) {
          const mediaContainer = document.createElement('div');
          mediaContainer.style.display = 'flex';
          mediaContainer.style.flexDirection = 'column';
          mediaContainer.style.gap = '8px';
          mediaContainer.style.marginTop = '4px';
          
          const btnsToRender = cfg.customAddBtns || [{ icon: "➕", text: "Добавить" }];
          
          btnsToRender.forEach((btn, subIdx) => {
              const rowWrapper = document.createElement('div');
              rowWrapper.className = 'media-section';
              
              const relevantMedia = mediaArray ? mediaArray.map((m, originalIndex) => ({...m, originalIndex})).filter(m => (m.subIdx === subIdx) || (m.subIdx === undefined && subIdx === 0)) : [];
              const hasSubMedia = relevantMedia.length > 0;

              const placeholder = document.createElement('div');
              placeholder.className = 'add-photo-placeholder';
              
              if (hasSubMedia) placeholder.classList.add('valid');
              placeholder.innerHTML = `<span>${btn.icon}</span>${btn.text}`;
              
              placeholder.onclick = () => { 
                  state.currentActiveIndex = idx; 
                  state.currentActiveSubIndex = subIdx; 
                  if (btn.isVideo) globalVideoInput.click();
                  else globalFileInput.click(); 
              };
              rowWrapper.appendChild(placeholder);

              const photosRow = document.createElement('div');
              photosRow.className = 'media-photos-row';
              
              if (hasSubMedia) {
                  relevantMedia.forEach(mData => {
                      const pContainer = document.createElement('div'); 
                      pContainer.className = 'photo-container';
                      
                      let previewSrc = mData.dataUrl;
                      if (mData.type === 'video' && mData.fileObj) previewSrc = URL.createObjectURL(mData.fileObj);
                      
                      let mediaEl;
                      if (mData.type === 'video') {
                          mediaEl = document.createElement('video');
                          mediaEl.src = previewSrc;
                          mediaEl.className = 'thumbnail';
                          mediaEl.muted = true;
                          mediaEl.onclick = (e) => { e.stopPropagation(); openLightbox(previewSrc, 'video'); };
                      } else {
                          mediaEl = document.createElement('img');
                          mediaEl.src = previewSrc;
                          mediaEl.className = 'thumbnail';
                          mediaEl.onclick = (e) => { e.stopPropagation(); openLightbox(previewSrc, 'image'); };
                      }
                      
                      const delBtn = document.createElement('button'); 
                      delBtn.className = 'delete-btn'; 
                      delBtn.innerHTML = '&times;'; 
                      delBtn.onclick = (e) => { e.stopPropagation(); removeMedia(idx, mData.originalIndex); };
                      
                      pContainer.appendChild(mediaEl); 
                      pContainer.appendChild(delBtn); 
                      photosRow.appendChild(pContainer);
                  });
              } else {

  // Валидация текущей страницы
  function updatePaginationButtons() {
    let currentValid = true;
    
    mandatoryConfig.forEach((cfg, idx) => {
        if (cfg.page !== state.currentPage) return;
        if (cfg.isOptional) return;

        if (cfg.isCheckbox && !state.checkboxes[cfg.prefix]) currentValid = false;
        
        let requiresPhoto = false;
        if (cfg.needsPhoto && !cfg.condPhotoFor) requiresPhoto = true;
        if (cfg.condPhotoFor && cfg.condPhotoFor.includes(state.selections[cfg.prefix])) requiresPhoto = true;

        if (requiresPhoto) {
            if (!state.media[idx] || state.media[idx].length === 0) {
                currentValid = false;
            } else {
                if (cfg.customAddBtns) {
                    for (let subIdx = 0; subIdx < cfg.customAddBtns.length; subIdx++) {
                        const hasSubMedia = state.media[idx].some(m => m.subIdx === subIdx || (m.subIdx === undefined && subIdx === 0));
                        if (!hasSubMedia) {
                            currentValid = false;
                            break;
                        }
                    }
                }
            }
        }
        
        if (cfg.options) {
            const sel = state.selections[cfg.prefix];
            if (!sel) currentValid = false;
            else if (cfg.condCommentFor && cfg.condCommentFor.includes(sel)) {
                if (!state.comments[cfg.prefix] || state.comments[cfg.prefix].trim() === '') currentValid = false;
            }
        } 
        else if (cfg.needsComment) {
            if (!state.comments[cfg.prefix] || state.comments[cfg.prefix].trim() === '') currentValid = false;
        }
    });

    if (state.currentPage === 1) {
        navNextBtn.classList.remove('hidden'); 
        navPrevBtn.classList.remove('hidden'); // Кнопка Назад на первой странице
        navPrevBtn.innerText = "К данным ПУРГ";
        generateReportBtn.classList.add('hidden');
        navNextBtn.disabled = !currentValid;
        
        manualSendInstructions.classList.add('hidden');
        shareTextBtn.classList.add('hidden');
    } 
    else if (state.currentPage === 2) {
        navNextBtn.classList.remove('hidden'); 
        navPrevBtn.classList.remove('hidden'); 
        navPrevBtn.innerText = "Назад";
        generateReportBtn.classList.add('hidden');
        navNextBtn.disabled = !currentValid;

        manualSendInstructions.classList.add('hidden');
        shareTextBtn.classList.add('hidden');
    } 
    else if (state.currentPage === 3) {
        navNextBtn.classList.add('hidden');
        navPrevBtn.classList.remove('hidden'); 
        navPrevBtn.innerText = "Назад";
        
        if (state.isReportGenerated) {
            generateReportBtn.classList.add('hidden');
            manualSendInstructions.classList.remove('hidden');
            shareTextBtn.classList.remove('hidden');
        } else {
            generateReportBtn.classList.remove('hidden');
            generateReportBtn.disabled = !currentValid;
            manualSendInstructions.classList.add('hidden');
            shareTextBtn.classList.add('hidden');
        }
    }
  }

  // Навигация
  navNextBtn.addEventListener('click', () => {
      if(state.currentPage < 3) {
          state.currentPage++;
          saveDraft(); renderChecklist(); window.scrollTo(0, 0);
      }
  });

  navPrevBtn.addEventListener('click', () => {
      if(state.currentPage === 1) {
          // Возврат на стартовый экран с формы 1
          checklistScreen.classList.add('hidden');
          formScreen.classList.remove('hidden');
      } else if(state.currentPage > 1) {
          state.currentPage--;
          saveDraft(); renderChecklist(); window.scrollTo(0, 0);
      }
  });

  // Обработка загрузки файлов
  const processFiles = async (e) => {
    const files = Array.from(e.target.files);
    const idx = state.currentActiveIndex; 
    const subIdx = state.currentActiveSubIndex;
    if (files.length === 0 || idx === null) return;
    
    for (let i = 0; i < files.length; i++) {
        let file = files[i];

        if (file.type.startsWith('video/')) {
            state.media[idx].push({ type: 'video', subIdx: subIdx, fileObj: file, dataUrl: URL.createObjectURL(file) });
        } else {
            await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); 
                        let width = img.width, height = img.height;
                        const MAX_SIDE = 1280; 
                        if (width > MAX_SIDE || height > MAX_SIDE) { 
                            if (width > height) { height *= MAX_SIDE / width; width = MAX_SIDE; } 
                            else { width *= MAX_SIDE / height; height = MAX_SIDE; } 
                        }
                        canvas.width = width; canvas.height = height; 
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7); 
                        
                        state.media[idx].push({ dataUrl: dataUrl, type: 'image', subIdx: subIdx });
                        resolve();
                    }; 
                    img.src = event.target.result;
                }; 
                reader.readAsDataURL(file);
            });
        }
    }
    
    markAsEdited(); 
    renderChecklist();
    e.target.value = '';
  };

  globalFileInput.addEventListener('change', processFiles);
  globalVideoInput.addEventListener('change', processFiles);

  function removeMedia(configIdx, originalMediaIdx) { 
    state.media[configIdx].splice(originalMediaIdx, 1); 
    markAsEdited();
    renderChecklist(); 
  }
  
  // Генерация красивого текстового отчета
  function buildEmailBodyText() {
    let text = `=======================================\n`;
    text += `ОТЧЕТ ТО ПУРГ\n`;
    text += `=======================================\n\n`;
    
    text += `📄 ИНФОРМАЦИЯ ОБ ОБЪЕКТЕ:\n`;
    text += `• Наименование: ${state.purgName}\n`;
    text += `• Адрес: ${state.address}\n`;
    text += `• Исполнитель: ${state.installerName}\n`;
    text += `• Дата: ${formatDateTime(state.creationDate)}\n`;
    text += `• GPS Координаты: ${(state.coordinates && !state.coordinates.error) ? state.coordinates.lat.toFixed(6) + ', ' + state.coordinates.lng.toFixed(6) : 'Не зафиксированы'}\n`;
    
    text += `\n=======================================\n`;
    text += `🛠️ ХОД ВЫПОЛНЕНИЯ РАБОТ:\n`;
    text += `=======================================\n\n`;
    
    mandatoryConfig.forEach((cfg, idx) => {
        text += `[${cfg.title}]\n`;
        if (cfg.isCheckbox) {
            text += `   — Статус: ${state.checkboxes[cfg.prefix] ? 'Выполнено' : 'Не выполнено'}\n`;
        }
        if (cfg.options && state.selections[cfg.prefix]) {
            text += `   — Статус: ${state.selections[cfg.prefix]}\n`;
        }
        if (state.comments[cfg.prefix]) {
            text += `   — Комментарий: ${state.comments[cfg.prefix]}\n`;
        }
        
        let requiresPhoto = false;
        if (cfg.needsPhoto && !cfg.condPhotoFor) requiresPhoto = true;
        if (cfg.condPhotoFor && cfg.condPhotoFor.includes(state.selections[cfg.prefix])) requiresPhoto = true;
        
        if (requiresPhoto && state.media[idx]) {
            if (cfg.customAddBtns) {
                cfg.customAddBtns.forEach((btn, subIdx) => {
                    const count = state.media[idx].filter(m => m.subIdx === subIdx || (m.subIdx === undefined && subIdx === 0)).length;
                    const cleanName = btn.text.replace('📸 ','').replace('🎥 ','');
                    text += `   — ${cleanName}: прикреплено ${count} шт.\n`;
                });
            } else {
                text += `   — Прикреплено файлов: ${state.media[idx].length} шт.\n`;
            }
        }
        text += '\n';
    });
    
    text += `=======================================\n`;
    text += `* Примечание: Видеозаписи отправляются отдельными файлами вместе с архивом.\n`;
    return text;
  }

  // Сборка ZIP архива (МГНОВЕННО, БЕЗ ВИДЕО)
  generateBtn.addEventListener('click', async () => {
    generateBtn.disabled = true;
    const emailBodyText = buildEmailBodyText();
    
    try {
      const zip = new JSZip();
      zip.file('Отчет_ТО_ПУРГ.txt', new TextEncoder().encode(emailBodyText));
      
      let videosToAttach = [];

      mandatoryConfig.forEach((cfg, idx) => { 
        if (state.media[idx]) {
            state.media[idx].forEach((mData, pIdx) => { 
                let btnSlug = "";
                if (cfg.customAddBtns && mData.subIdx !== undefined) {
                     const rawText = cfg.customAddBtns[mData.subIdx].text;
                     btnSlug = `_${rawText.replace(/[^a-zа-яё0-9]/gi, '_')}`;
                }
                
                const safePrefix = cfg.filePrefix || cfg.prefix;
                
                if (mData.type === 'video' && mData.fileObj) {
                    const fileName = `${safePrefix}${btnSlug}_${pIdx + 1}.mp4`;
                    videosToAttach.push({ name: fileName, blob: mData.fileObj });
                } else if (mData.dataUrl) {
                    const fileName = `${safePrefix}${btnSlug}_${pIdx + 1}.jpg`;
                    const b64Data = mData.dataUrl.split(',')[1];
                    zip.file(fileName, b64Data, {base64: true}); 
                }
            });
        }
      });
      
      const zipContentUint8 = await zip.generateAsync({ type: "uint8array", compression: "STORE" });
      
      const d = new Date(state.creationDate); 
      const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      let sanitizedName = state.purgName.replace(/[^a-zа-яё0-9]/gi, '_').substring(0, 24);
      
      currentZipName = `${sanitizedName}_${dateStr}.zip`;

      const fbReportData = { 
        purgName: state.purgName, address: state.address, installer: state.installerName, 
        gps: (state.coordinates && !state.coordinates.error) ? `${state.coordinates.lat.toFixed(6)}, ${state.coordinates.lng.toFixed(6)}` : 'Нет', 
        date: formatDateTime(state.creationDate), timestamp: Date.now(), comments: state.comments, selections: state.selections, checkboxes: state.checkboxes
      };

      function pushToFirebase(data) { 
        if (fbDb && navigator.onLine) { fbDb.ref('purg_reports').push(data).catch(() => saveToPendingSync(data)); } 
        else { saveToPendingSync(data); } 
      }
      function saveToPendingSync(data) { 
        if (!db) return; db.transaction("pending_sync", "readwrite").objectStore("pending_sync").add({ data: data }); 
      }
      
      pushToFirebase(fbReportData);

      const base64Data = uint8ToBase64(zipContentUint8);
      
      if (db) {
        const tx = db.transaction("archives", "readwrite");
        tx.oncomplete = function() {
          state.isReportGenerated = true; 
          resetGenBtn();
          saveDraft();
          savedFileNameSpan.innerText = currentZipName;
          updatePaginationButtons(); 
        };
        tx.onerror = function(err) { alert("Сбой записи в БД. Освободите память устройства."); resetGenBtn(); };
        tx.onabort = function(err) { alert("Сохранение прервано системой."); resetGenBtn(); };

        tx.objectStore("archives").put({ 
          name: currentZipName, 
          base64: base64Data, 
          text: emailBodyText, 
          date: new Date().toISOString(),
          videos: videosToAttach
        });
      } else {
        alert("Локальная память браузера недоступна."); resetGenBtn();
      }
    } catch (err) { alert("Сбой сборки: " + err.message); resetGenBtn(); }
  });

  shareTextBtn.addEventListener('click', () => {
    const req = db.transaction("archives", "readonly").objectStore("archives").get(currentZipName);
    req.onsuccess = (e) => {
       const result = e.target.result;
       if (result) { shareFiles([result], `ТО: ${state.purgName}`); }
       else { alert("Файл не найден в базе."); }
    };
  });

  // Кнопка Старта
  document.getElementById('startReportBtn').addEventListener('click', () => {
    state.purgName = document.getElementById('purgName').value.trim(); 
    state.address = document.getElementById('address').value.trim(); 
    state.installerName = document.getElementById('installerName').value.trim();
    
    if (!state.purgName || !state.address || !state.installerName) { 
        updateMainValidation(); 
        return; 
    }
    
    localStorage.setItem('installerName', state.installerName);
    formScreen.classList.add('hidden'); 
    checklistScreen.classList.remove('hidden');
    
    if (!navigator.onLine) syncStatus.classList.remove('hidden');
    state.creationDate = new Date().toISOString(); 
    startActiveGeoSearch(); 
    saveDraft(); 
    renderChecklist();
  });

  resetAllBtn.addEventListener('click', () => {
    document.getElementById('confirmFinishModal').style.display = 'flex';
  });
  document.getElementById('cancelFinishBtn').addEventListener('click', () => {
    document.getElementById('confirmFinishModal').style.display = 'none';
  });

  // Полный сброс приложения
  document.getElementById('confirmFinishBtn').addEventListener('click', () => {
    document.getElementById('confirmFinishModal').style.display = 'none';
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } 
    if (gpsTimeoutId !== null) { clearTimeout(gpsTimeoutId); gpsTimeoutId = null; }
    
    state = { 
      purgName: '', address: '', installerName: localStorage.getItem('installerName') || '', 
      coordinates: null, creationDate: null, gpsLocked: false, 
      media: Array.from({ length: mandatoryConfig.length }, () => []), 
      comments: {}, selections: {}, checkboxes: {}, 
      currentPage: 1, currentActiveIndex: null, currentActiveSubIndex: null, isReportGenerated: false
    };
    currentZipName = "";
    document.getElementById('purgName').value = ''; 
    document.getElementById('address').value = ''; 
    
    clearDraft(); updateMainValidation();
    manualSendInstructions.classList.add('hidden'); 
    shareTextBtn.classList.add('hidden'); 
    resetGenBtn(); 
    generateBtn.classList.remove('hidden');
    checklistScreen.classList.add('hidden'); 
    formScreen.classList.remove('hidden');
  });

  // ================= МЕНЕДЖЕР АРХИВОВ =================
  document.getElementById('openArchivesBtn').addEventListener('click', () => { formScreen.classList.add('hidden'); archiveScreen.classList.remove('hidden'); loadArchives(); });
  document.getElementById('backFromArchivesBtn').addEventListener('click', () => { archiveScreen.classList.add('hidden'); formScreen.classList.remove('hidden'); isMultiSelectMode = false; selectedArchives.clear(); multiActionBar.classList.add('hidden'); archiveListContainer.style.paddingBottom = "0px"; });

  let savedArchives = []; let selectedArchives = new Set(); let isMultiSelectMode = false;

  function loadArchives() {
    archiveListContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: #64748b;">Загрузка архивов...</div>';
    if (!db) { archiveListContainer.innerHTML = '<div style="text-align:center; padding: 20px;">Ошибка БД</div>'; return; }
    db.transaction("archives", "readonly").objectStore("archives").getAll().onsuccess = (e) => {
      savedArchives = e.target.result; savedArchives.sort((a, b) => b.date.localeCompare(a.date)); renderArchiveList();
    };
  }

  function renderArchiveList() {
    archiveListContainer.innerHTML = '';
    if (savedArchives.length === 0) { archiveListContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: #64748b;">Архивов пока нет.</div>'; multiActionBar.classList.add('hidden'); archiveListContainer.style.paddingBottom = "0px"; return; }
    savedArchives.forEach(archive => {
      const item = document.createElement('div'); item.className = 'archive-item'; if (selectedArchives.has(archive.name)) item.classList.add('selected');
      const checkbox = document.createElement('div'); checkbox.className = 'archive-checkbox';
      const info = document.createElement('div'); info.className = 'archive-info'; info.innerHTML = `<div class="archive-name">${archive.name}</div>`;
      item.appendChild(checkbox); item.appendChild(info);
      checkbox.addEventListener('click', (e) => { e.stopPropagation(); if (!isMultiSelectMode) isMultiSelectMode = true; toggleSelection(archive.name, item); });
      item.addEventListener('click', () => { if (isMultiSelectMode) { toggleSelection(archive.name, item); } else { shareFiles([archive], "Отправка архива"); } });
      let pressTimer; item.addEventListener('touchstart', () => { pressTimer = window.setTimeout(() => { if (!isMultiSelectMode) { isMultiSelectMode = true; toggleSelection(archive.name, item); renderArchiveList(); } }, 600); }, {passive: true}); item.addEventListener('touchend', () => clearTimeout(pressTimer));
      archiveListContainer.appendChild(item);
    });
    if (isMultiSelectMode && selectedArchives.size > 0) { multiActionBar.classList.remove('hidden'); archiveListContainer.style.paddingBottom = "120px"; document.getElementById('multiSendBtn').innerText = `Отправить (${selectedArchives.size})`; document.getElementById('multiDeleteBtn').innerText = `Удалить (${selectedArchives.size})`; } else { multiActionBar.classList.add('hidden'); archiveListContainer.style.paddingBottom = "0px"; if (selectedArchives.size === 0) isMultiSelectMode = false; }
  }

  function toggleSelection(name, itemElement) { if (selectedArchives.has(name)) { selectedArchives.delete(name); itemElement.classList.remove('selected'); } else { selectedArchives.add(name); itemElement.classList.add('selected'); } renderArchiveList(); }
  document.getElementById('selectAllBtn').addEventListener('click', () => { savedArchives.forEach(a => selectedArchives.add(a.name)); renderArchiveList(); });
  document.getElementById('deselectAllBtn').addEventListener('click', () => { selectedArchives.clear(); isMultiSelectMode = false; renderArchiveList(); });

  async function shareFiles(filesDataArray, subjectText) {
    const filesToShare = [];
    
    filesDataArray.forEach(f => {
      if (f.base64) { 
          let zipBlob = new Blob([base64ToUint8(f.base64)], { type: "application/zip" }); 
          filesToShare.push(new File([zipBlob], f.name, { type: "application/zip" }));
      } 
      if (f.videos && f.videos.length > 0) {
          f.videos.forEach(v => {
              filesToShare.push(new File([v.blob], v.name, { type: "video/mp4" }));
          });
      }
    });

    if (navigator.canShare && navigator.canShare({ files: filesToShare })) {
      try {
        let textMsg = filesDataArray.length === 1 ? filesDataArray[0].text : "Архивы фотоотчетов во вложении.";
        await navigator.share({ files: filesToShare, title: subjectText, text: textMsg });
        if (isMultiSelectMode) { selectedArchives.clear(); isMultiSelectMode = false; renderArchiveList(); } return;
      } catch (err) { console.log("Share skipped/failed"); }
    }

    filesDataArray.forEach(f => {
      if (f.base64) {
          let fileBlob = new Blob([base64ToUint8(f.base64)], { type: "application/zip" });
          const link = document.createElement('a'); link.href = URL.createObjectURL(fileBlob); link.download = f.name; document.body.appendChild(link); link.click(); document.body.removeChild(link);
      }
      if (f.videos) {
          f.videos.forEach(v => {
              const link = document.createElement('a'); link.href = URL.createObjectURL(v.blob); link.download = v.name; document.body.appendChild(link); link.click(); document.body.removeChild(link);
          });
      }
    });
    if (isMultiSelectMode) { selectedArchives.clear(); isMultiSelectMode = false; renderArchiveList(); }
  }

  function deleteFiles(namesArray) {
    if (confirm(`Удалить выбранные архивы (${namesArray.length} шт)?`)) {
      const tx = db.transaction("archives", "readwrite"); const store = tx.objectStore("archives");
      namesArray.forEach(name => store.delete(name));
      tx.oncomplete = () => { selectedArchives.clear(); isMultiSelectMode = false; loadArchives(); };
    }
  }

  document.getElementById('multiSendBtn').addEventListener('click', () => { let toShare = savedArchives.filter(a => selectedArchives.has(a.name)); shareFiles(toShare, "Отправка архивов ТО ПУРГ"); });
  document.getElementById('multiDeleteBtn').addEventListener('click', () => { deleteFiles(Array.from(selectedArchives)); });

  // Лайтбокс
  const modal = document.getElementById('photoModal'), modalImg = document.getElementById('modalImg'), modalVideo = document.getElementById('modalVideo'), modalWrapper = document.getElementById('modalWrapper');
  let scale = 1, startDist = 0, isDragging = false, startX = 0, startY = 0, posX = 0, posY = 0;
  
  function openLightbox(url, type) { 
    if(type === 'video'){
        modalImg.style.display = 'none';
        modalVideo.src = url;
        modalVideo.style.display = 'block';
    } else {
        modalVideo.style.display = 'none';
        modalVideo.src = '';
        modalImg.src = url;
        modalImg.style.display = 'block';
    }
    modal.style.display = 'flex'; resetZoom(); 
  }
  function closeLightbox() { modal.style.display = 'none'; modalImg.src = ''; modalVideo.src = ''; }
  function resetZoom() { scale = 1; posX = 0; posY = 0; updateTransform(); }
  function updateTransform() { modalWrapper.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }
  
  document.getElementById('modalClose').addEventListener('click', closeLightbox);
  modal.addEventListener('click', (e) => { if (e.target === modal || e.target === modalWrapper) closeLightbox(); });
  modal.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); } else if (e.touches.length === 1 && scale > 1) { isDragging = true; startX = e.touches[0].pageX - posX; startY = e.touches[0].pageY - posY; } }, { passive: true });
  modal.addEventListener('touchmove', (e) => { if (e.touches.length === 2 && startDist > 0) { const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); scale = Math.min(Math.max(1, (dist / startDist)), 4); updateTransform(); } else if (e.touches.length === 1 && isDragging) { posX = e.touches[0].pageX - startX; posY = e.touches[0].pageY - startY; updateTransform(); } }, { passive: true });
  modal.addEventListener('touchend', (e) => { if (e.touches.length < 2) startDist = 0; if (e.touches.length === 0) isDragging = false; });
</script>
